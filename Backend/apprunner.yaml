version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Build started on `date`"
      - echo "Building the Docker image..."
      - docker build -t culinary-ai-backend .
run:
  runtime-version: latest
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT
  env:
    - name: AWS_REGION
      value: "ap-southeast-2"
    - name: NEO4J_URI
      value: "neo4j+s://06ad204b.databases.neo4j.io"
    - name: NEO4J_USER
      value: "neo4j"
    - name: API_V1_STR
      value: "/api/v1"